<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) resolves and the fixed
         phone bar clears the home indicator on iPhones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>МИХАЛ ЕООД — Качествен сух дървен материал</title>
    <meta
      name="description"
      content="Сух дървен материал от Разлог — дюшеме, ламперия, греди и слепени греди. Складова база, собствена сушилня, рязане по размер и доставка в цялата страна."
    />
    <meta name="theme-color" content="#f7f1e8" />

    <!-- Link previews (Facebook, Messenger, Viber, LinkedIn).
         og:image must be an absolute URL — a relative path is not resolved by
         the scrapers. Update SITE_URL here if a custom domain replaces the
         netlify.app address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="МИХАЛ ЕООД" />
    <meta property="og:locale" content="bg_BG" />
    <meta property="og:url" content="https://mihal-eood.netlify.app/" />
    <meta property="og:title" content="МИХАЛ ЕООД — Качествен сух дървен материал" />
    <meta
      property="og:description"
      content="Сух дървен материал, дюшеме, ламперия и слепени греди от Разлог. Складова база, собствен транспорт и подемна техника."
    />
    <meta property="og:image" content="https://mihal-eood.netlify.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="МИХАЛ ЕООД — качествен сух дървен материал от Разлог" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="МИХАЛ ЕООД — Качествен сух дървен материал" />
    <meta
      name="twitter:description"
      content="Сух дървен материал, дюшеме, ламперия и слепени греди от Разлог."
    />
    <meta name="twitter:image" content="https://mihal-eood.netlify.app/og-image.jpg" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/oswald-200-700-cyrillic.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/oswald-200-700-latin.woff2"
      crossorigin
    />
  </head>
  <body>
    <!-- Netlify Forms: the deploy bot only registers forms it finds in static
         HTML, and the contact form is rendered by React. This hidden twin
         carries the same name and fields so submissions are accepted. -->
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      enctype="multipart/form-data"
      hidden
    >
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="material" />
      <textarea name="message"></textarea>
      <input type="file" name="attachment" />
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
