    <!-- Netlify Forms: the deploy bot only registers forms it finds in static
         HTML, and the contact form is rendered by React. This hidden twin
         carries the same name and fields so submissions are accepted. -->
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      enctype="multipart/form-data"
      hidden
    >
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="material" />
      <textarea name="message"></textarea>
      <textarea name="calculation"></textarea>
      <input type="file" name="attachment" />
      <input type="text" name="bot-field" />
    </form>
